# Tag vX.Y.Z (matching package.json "version") → test, build the Windows installers, smoke-test the
# packaged app, then publish:
#   1. Cloudflare R2 (the download site and the auto-update feed the app reads):
#      installers + blockmaps first, then latest.yml (x64) and latest-arm64.yml (arm64), so the feed
#      never points at a file that is not uploaded yet.
#   2. A GitHub Release with the same files.
# Repository secrets: R2_ACCOUNT_ID, R2_ACCESS_KEY_ID, R2_SECRET_ACCESS_KEY, R2_BUCKET.
# Repository variable (optional): OVERLOOK_DOWNLOAD_URL, the public URL of the R2 folder
# (default https://dl.agenthub.pt/overlook); it is baked into the app as the update feed.
name: Release
on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Tag matches package version
        shell: bash
        run: |
          v=$(node -p "require('./package.json').version")
          [ "v$v" = "$GITHUB_REF_NAME" ] || { echo "Tag $GITHUB_REF_NAME does not match package.json version $v"; exit 1; }
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:smoke
      - run: npm run dist
        env:
          OVERLOOK_DOWNLOAD_URL: ${{ vars.OVERLOOK_DOWNLOAD_URL }}
      - name: Smoke-test the packaged x64 app (win-unpacked)
        run: npm run test:desktop
      - name: Upload to Cloudflare R2
        shell: bash
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          ENDPOINT: https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
          BUCKET: ${{ secrets.R2_BUCKET }}
          PREFIX: overlook
        run: |
          cd apps/desktop/release
          put() { aws s3 cp "$1" "s3://$BUCKET/$PREFIX/$1" --endpoint-url "$ENDPOINT" --only-show-errors --cache-control "$2"; }
          for f in Overlook-Setup-*.exe Overlook-Setup-*.exe.blockmap; do put "$f" "public, max-age=31536000, immutable"; done
          for f in latest.yml latest-arm64.yml; do put "$f" "no-cache"; done
      - name: Publish GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd apps/desktop/release
          files="Overlook-Setup-*.exe Overlook-Setup-*.exe.blockmap latest.yml latest-arm64.yml"
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" $files --clobber
          else
            gh release create "$GITHUB_REF_NAME" --title "Overlook $GITHUB_REF_NAME" --generate-notes $files
          fi
