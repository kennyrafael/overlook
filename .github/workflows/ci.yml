# Unit + e2e + browser smoke tests on every push to main.
name: CI
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:smoke

  # Landing page (site/, its own package): unit tests, production build, then the built page in the
  # runner's Chrome with no server: every demo, install tabs, reduced motion, JavaScript off, six widths,
  # touch, heading order and axe (WCAG 2.1 A/AA).
  site:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm run check:demos
      - run: npm run audit
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: site-screenshots
          path: site/test-results/
          retention-days: 7
