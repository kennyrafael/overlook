<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Overlook</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link id="theme-link" rel="stylesheet" />
    <style>
      /* Boot loader: styled inline so it shows before any stylesheet has loaded (see src/boot/loader.ts). */
      html, body { margin: 0; background: #111827; }
      #boot-loader { position: fixed; inset: 0; z-index: 10000; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1rem; background: #111827; color: #9ca3af; font: 0.9rem system-ui, -apple-system, 'Segoe UI', sans-serif; transition: opacity 0.3s ease; }
      #boot-logo { width: 96px; height: 96px; position: relative; }
      #boot-logo > * { position: absolute; inset: 0; width: 100%; height: 100%; }
      #boot-loader.boot-loader-done { opacity: 0; pointer-events: none; }
      @media (prefers-color-scheme: light) {
        html:not([data-theme='dark']), html:not([data-theme='dark']) body, html:not([data-theme='dark']) #boot-loader { background: #f9fafb; color: #6b7280; }
      }
      html[data-theme='light'], html[data-theme='light'] body, html[data-theme='light'] #boot-loader { background: #f9fafb; color: #6b7280; }
    </style>
  </head>
  <body>
    <div id="boot-loader" role="status" aria-label="Loading Overlook">
      <div id="boot-logo"><img src="/favicon.svg" alt="" /></div>
      <span>Loading…</span>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
